[package]
name = "gcm"
version = "0.1.0"
edition = "2024"
description = "Graphical Cloud Manager — an MMC-style Microsoft 365 admin console"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", default-features = false }
getrandom = "0.4.3"
open = "5.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "query", "form", "gzip", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
toml = "1.1.4"
urlencoding = "2.1.3"
