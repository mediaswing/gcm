[package]
name = "gcm"
version = "1.8.0"
edition = "2024"
description = "Graphical Cloud Manager — an MMC-style console for Microsoft 365 and on-premises Active Directory"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
directories = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", default-features = false }
getrandom = "0.4.3"
# On-premises Active Directory. rustls-ring for the same reason as mysql_async
# below — one TLS stack in the binary, not three. This feature also brings in
# rustls-native-certs, which is what lets LDAPS validate against an internal
# enterprise CA from the OS trust store rather than webpki's public roots.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
# The MariaDB export. rustls rather than the default native-tls, so the whole
# binary has one TLS stack — the same one reqwest already links — instead of
# also dragging in OpenSSL or Schannel.
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls-ring", "chrono"] }
open = "5.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "query", "form", "gzip", "system-proxy"] }
rfd = "0.17.2"
# Not used for TLS directly. ldap3 builds its client config with
# `ClientConfig::builder()`, which reads a process-wide crypto provider it never
# installs — so gcm installs one itself before the first bind, or the first
# LDAPS connection panics. Same crate and version reqwest already links, so this
# compiles no additional code. See src/ldap/mod.rs.
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
toml = "1.1.4"
urlencoding = "2.1.3"
# Unpacking the release zip during a self-update. Deflate is the only codec
# either packaging step (PowerShell's Compress-Archive, macOS's `zip`) uses,
# so nothing else needs to compile in.
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

# Configuration storage on Windows, where the settings live under
# HKEY_CURRENT_USER\Software\gcm rather than in config.ini — see src/registry.rs
# for why. This costs no extra compile: reqwest's system-proxy support already
# links the same version transitively.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
# Integrated Windows authentication for LDAP, so a Directory read runs as the
# signed-in operator and AD's own delegations apply. The feature pulls
# cross-krb5, which wraps SSPI on Windows — no MIT Kerberos install, and no new
# system DLL beyond secur32.dll, which the release workflow's import check
# already treats as part of Windows.
#
# Windows-only deliberately, and not merely because that is where it is useful:
# off Windows cross-krb5 binds to libgssapi, which does not compile against the
# Heimdal that ships with macOS. Cargo unions this with the base ldap3 entry, so
# a Windows build gets tls-rustls-ring and gssapi together.
ldap3 = { version = "0.12.1", default-features = false, features = ["gssapi"] }
